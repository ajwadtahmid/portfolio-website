        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script>
            // Motion preference, applied before first paint so animations never
            // flash for visitors who opted out: saved choice, else the OS setting.
            (function () {
                try {
                    var s = localStorage.getItem("motion");
                    var off = s
                        ? s === "off"
                        : matchMedia("(prefers-reduced-motion: reduce)").matches;
                    document.documentElement.dataset.motion = off ? "off" : "on";
                    // Theme: saved choice, else the OS light/dark setting
                    var t = localStorage.getItem("theme");
                    var light = t
                        ? t === "light"
                        : matchMedia("(prefers-color-scheme: light)").matches;
                    if (light) document.documentElement.classList.add("lm");
                } catch (e) {}
            })();
        </script>
